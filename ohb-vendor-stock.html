<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vendor Stock Balances · On-Hand Balances · Vendor Managed Inventory prototype</title>
  <link rel="stylesheet" href="css/clarity-tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="csp-page ent-page">
  <main class="csp-main ent">
    <h1>On-Hand Balances</h1>
    <p class="tab-intro">Stock that <b>Northwind Supply Co.</b> manages in your warehouses under Vendor Managed Inventory. Balances are maintained by the supplier in the Coupa Supplier Portal and are read-only here.</p>
    <section class="csp-card" aria-label="Vendor Stock Balances">
      <div class="views-row">
        <button class="views-btn" id="views-btn" aria-haspopup="menu" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
          Views
        </button>
        <span class="current" id="view-name">All</span>
      </div>

      <div class="toolbar">
        <label class="tb-search csp-legacy">
          <input id="search" placeholder="Search in this view" aria-label="Search Vendor Stock Balances">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>
        </label>
        <button class="tb-btn" id="filter-btn" aria-label="Filter by warehouse" aria-haspopup="menu" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3.5 4.5h17l-6.5 8v6l-4 2v-8z"/></svg>
        </button>
        <button class="tb-btn" id="more-btn" aria-label="More actions" aria-haspopup="menu" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </button>
      </div>

      <div class="table-scroll" tabindex="0" aria-label="Table, scrolls horizontally">
        <table class="items csp-legacy wide">
          <thead><tr id="head"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script>window.ITEMS_PAGE = { tab: 'Vendor Stock Balances' };</script>
  <script src="js/supplier-data.js"></script>
  <script src="js/supplier-items.js"></script>
</body>
</html>
