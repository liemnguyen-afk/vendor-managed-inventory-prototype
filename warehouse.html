<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Warehouse · Vendor Managed Inventory prototype</title>
  <link rel="stylesheet" href="css/clarity-tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="shell-blue">
  <div class="sheet">
    <main class="classic">
      <h1 id="wh-name"></h1>

      <div class="detail-head">
        <dl class="detail" id="wh-detail"></dl>
        <div class="back"><a href="#" data-stub>« back to Warehouses</a></div>
      </div>

      <h2 class="plain">Locations</h2>
      <div class="dt-bar">
        <button class="btn-gray" data-stub>Create</button>
        <button class="btn-gray" data-stub>Load from file</button>
        <button class="btn-gray" data-stub>Export to <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5l3 3 3-3"/></svg></button>
        <span class="spacer"></span>
        <span class="view">View</span>
        <select id="view" aria-label="View">
          <option>All</option>
          <option>Active</option>
          <option>Inactive</option>
        </select>
        <button class="btn-clock" data-stub aria-label="Recent views">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#e8890c" stroke-width="1.4" stroke-linecap="round"><circle cx="9" cy="9" r="7.3"/><path d="M9 5v4.2h3"/></svg>
        </button>
        <button class="btn-gray" data-stub>Advanced search</button>
        <label class="dt-search">
          <input id="search" placeholder="Search" aria-label="Search locations">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="#1d91d8" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="6" r="4.3"/><path d="M5.8 9.2L1.5 13.5"/></svg>
        </label>
      </div>
      <table class="dt">
        <colgroup><col style="width:177px"><col style="width:132px"><col style="width:185px"><col style="width:211px"><col></colgroup>
        <thead><tr><th>Aisle</th><th>Bin</th><th>Level</th><th>Active</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="per-page" id="per-page"></div>

      <div class="detail-actions">
        <button class="btn-gray" data-stub id="wh-edit"></button>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    initPage({ theme: 'blue' }, { logo: false });

    const PENCIL = '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M14.6 2.4l3 3L7 16l-3 .9.9-3z" fill="#e8890c"/><path d="M4 16.9l-1.8.9.9-1.8z" fill="#2f2f2f"/></svg>';
    const list = loadWarehouses();
    const wh = list.find(w => w.id === new URLSearchParams(location.search).get('id')) || list[0];
    const locations = wh.locations;

    document.title = `${wh.name} · Vendor Managed Inventory prototype`;
    document.getElementById('wh-name').textContent = wh.name;
    document.getElementById('wh-edit').textContent = `Edit ${wh.name}`;
    const dd = (v, cls = '') => v ? `<dd class="${cls}">${esc(v)}</dd>` : '<dd class="none">None</dd>';
    document.getElementById('wh-detail').innerHTML = `
      <dt>Name</dt>${dd(wh.name)}
      <dt>Description</dt>${dd(wh.description)}
      <dt>Currency</dt>${dd(wh.currency)}
      <dt>Active</dt><dd><input type="checkbox" ${wh.active ? 'checked' : ''} onclick="return false" aria-label="Active"></dd>
      <dt>Orders</dt><dd><a href="#" data-stub>Unreceived orders for this warehouse</a></dd>
      <dt>Custom Field 1</dt>${dd(wh.cf1)}
      <dt>Custom Field 2</dt>${dd(wh.cf2)}
      <dt>Custom Field 3</dt>${dd(wh.cf3)}
      <dt>tx box cf</dt>${dd(wh.txbox)}
      <dt>Certifications</dt>${dd(wh.certifications)}
      <dt>Cycle Count Watcher</dt>${dd(wh.watcher)}
      <dt>CF Attachments</dt>${dd(wh.attachments)}`;
    if (sessionStorage.getItem('vmi.flash')) { flash(sessionStorage.getItem('vmi.flash')); sessionStorage.removeItem('vmi.flash'); }

    let perPage = 15, current = 0;

    function render() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const view = document.getElementById('view').value;
      const shown = locations
        .map((l, i) => ({ ...l, i }))
        .filter(l => view === 'All' || l.active === (view === 'Active'))
        .filter(l => !q || [l.aisle, l.bin, l.level].some(v => v.toLowerCase().includes(q)))
        .slice(0, perPage);
      document.getElementById('rows').innerHTML = shown.length
        ? shown.map(l => `<tr data-i="${l.i}" class="${l.i === current ? 'current' : ''}">
            <td>${esc(l.aisle)}</td><td>${esc(l.bin)}</td><td>${esc(l.level)}</td><td>${l.active ? 'Yes' : 'No'}</td>
            <td><a href="#" class="edit" data-stub aria-label="Edit location ${esc(l.aisle)}">${PENCIL}</a></td></tr>`).join('')
        : '<tr class="empty"><td colspan="5">No rows</td></tr>';
      document.getElementById('per-page').innerHTML = 'Per page ' + [15, 45, 90]
        .map(n => n === perPage ? `<b>${n}</b>` : `<a href="#" data-per="${n}">${n}</a>`).join(' <i>|</i> ');
    }

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('view').addEventListener('change', render);
    document.getElementById('per-page').addEventListener('click', e => {
      const a = e.target.closest('[data-per]');
      if (!a) return;
      e.preventDefault();
      perPage = +a.dataset.per;
      render();
    });
    document.getElementById('rows').addEventListener('click', e => {
      const tr = e.target.closest('tr[data-i]');
      if (!tr) return;
      current = +tr.dataset.i;
      render();
    });

    render();
  </script>
</body>
</html>
