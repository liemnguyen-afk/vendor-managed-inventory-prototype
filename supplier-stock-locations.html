<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stock Locations · Coupa Supplier Portal · Vendor Managed Inventory prototype</title>
  <link rel="stylesheet" href="css/clarity-tokens.css?v=202611121439">
  <link rel="stylesheet" href="css/styles.css?v=202611121439">
</head>
<body class="csp-page">
  <main class="csp-main">
    <div class="cust csp-legacy">
      <label for="customer">Select Customer</label>
      <select id="customer">
        <option>Buyer Demo Company</option>
        <option>Coupa Demo Co</option>
      </select>
    </div>

    <h1>Stock Locations</h1>

    <section class="csp-card" aria-label="Stock Locations">
      <div class="views-row">
        <button class="views-btn" data-stub>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
          Views
        </button>
        <span class="current">All</span>
      </div>
      <div class="toolbar sl-toolbar">
        <a class="btn-outline-sm sl-create" href="supplier-stock-location-new.html">Create</a>
        <span class="sl-spacer"></span>
        <label class="tb-search csp-legacy">
          <input id="search" placeholder="Search" aria-label="Search stock locations">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>
        </label>
        <button class="tb-btn" data-stub aria-label="Filter">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
        </button>
        <button class="tb-btn" id="more-btn" aria-label="More actions" aria-haspopup="menu" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </button>
      </div>
      <div id="table-wrap" class="table-scroll" tabindex="0" aria-label="Stock locations table">
        <table class="items csp-legacy wide sl-table">
          <thead><tr>
            <th>Name</th><th>Description</th><th>Type</th><th>Active</th><th>Address</th>
            <th>Created By</th><th>Created Date</th><th>Last Updated By</th><th>Last Updated Date</th><th class="act">Actions</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="zero" class="sl-zero" hidden>
        <svg width="72" height="72" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M10 28L36 14l26 14v30H10z"/><path d="M22 58V38h28v20M22 46h28M30 38v20M42 38v20"/></svg>
        <h2>No stock locations yet</h2>
        <p>Create a stock location for <b id="zero-cust"></b> to start sharing the stock you hold for this customer.</p>
        <a class="btn-primary-sm" href="supplier-stock-location-new.html">Create stock location</a>
      </div>
    </section>
  </main>

  <script src="js/app.js?v=202611121439"></script>
  <script src="js/supplier-data.js?v=202611121439"></script>
  <script>
    renderCspHeader({ primary: 'Stock Levels', tab: 'Stock Locations' });

    const PENCIL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 20l1-4.2L15.6 5.2a2 2 0 012.8 0l.4.4a2 2 0 010 2.8L8.2 19 4 20zM13.5 7.3l3.2 3.2"/></svg>';
    const params = new URLSearchParams(location.search);
    const sel = document.getElementById('customer');
    const qc = params.get('customer') || sessionStorage.getItem('vmi.cspCustomer');
    let customer = STOCK_LOCATIONS[qc] ? qc : 'Buyer Demo Company', q = '';
    sel.value = customer; sessionStorage.setItem('vmi.cspCustomer', customer);
    const addr = l => [l.line1, l.line2, [[l.city || l.town, l.state].filter(Boolean).join(', '), l.zip].filter(Boolean).join(' '), l.country].filter(Boolean);

    function render() {
      const all = stockLocationsFor(customer), s = q.toLowerCase();
      document.getElementById('table-wrap').hidden = !all.length;
      document.querySelector('.sl-toolbar').hidden = !all.length;
      document.getElementById('zero').hidden = !!all.length;
      document.getElementById('zero-cust').textContent = customer;
      document.querySelectorAll('a[href^="supplier-stock-location-new.html"]:not(.row-act)').forEach(a => { a.href = `supplier-stock-location-new.html?customer=${encodeURIComponent(customer)}`; });
      const rows = all.filter(l => !s || [l.code, l.name, l.description, ...addr(l), l.createdBy, l.updatedBy].some(v => (v || '').toLowerCase().includes(s)));
      document.getElementById('rows').innerHTML = rows.length ? rows.map(l => `<tr>
          <td><a href="supplier-stock-location.html?q=${encodeURIComponent(l.name)}" title="View stock balances in ${esc(l.name)}">${esc(l.name)}</a></td>
          <td class="sl-desc">${esc(l.description)}</td>
          <td>${esc(l.type || 'Warehouse')}</td>
          <td>${l.active ? 'Yes' : 'No'}</td>
          <td class="sl-addr">${addr(l).map(esc).join('<br>')}</td>
          <td>${esc(l.createdBy)}</td>
          <td>${fmtDate(l.createdOn)}</td>
          <td>${esc(l.updatedBy || l.createdBy)}</td>
          <td>${fmtDate(l.updatedOn || l.createdOn)}</td>
          <td class="act"><a class="row-act" href="supplier-stock-location-new.html?edit=${encodeURIComponent(l.code)}&customer=${encodeURIComponent(customer)}" aria-label="Edit ${esc(l.name)}">${PENCIL}</a></td>
        </tr>`).join('') : '<tr class="empty"><td colspan="10">No results found</td></tr>';
    }
    document.getElementById('search').addEventListener('input', e => { q = e.target.value.trim(); render(); });
    sel.addEventListener('change', e => { customer = e.target.value; sessionStorage.setItem('vmi.cspCustomer', customer); render(); });

    // ⋮ menu (Figma 155:12706): Load from file → Bulk Load, exports, schedule
    document.getElementById('more-btn').addEventListener('click', e => {
      e.stopPropagation();
      document.querySelector('.menu')?.remove();
      const m = document.createElement('div'); m.className = 'menu menu-lg'; m.setAttribute('role', 'menu');
      m.innerHTML = ['Load from file', 'Export as CSV Plain Text (Current Columns)', 'Schedule report']
        .map((l, i) => `<button role="menuitem" data-i="${i}"><span>${l}</span></button>`).join('');
      document.body.appendChild(m);
      const r = e.currentTarget.getBoundingClientRect();
      m.style.top = `${r.bottom + scrollY + 4}px`; m.style.left = `${r.right + scrollX - m.offsetWidth}px`;
      m.addEventListener('click', ev => {
        const i = ev.target.closest('[data-i]')?.dataset.i; m.remove();
        if (i === '0') location.href = `supplier-bulk-load.html?from=locations&customer=${encodeURIComponent(customer)}`;
        else if (i === '1') { exportCsvPlain('stock-locations', [['Name', 'Code', 'Description', 'Type', 'Active', 'Address', 'Attention', 'Attention Email', 'Storage Locations', 'Created By', 'Created Date', 'Last Updated By', 'Last Updated Date'],
          ...stockLocationsFor(customer).map(l => [l.name, l.code, l.description, l.type, l.active ? 'Yes' : 'No', addr(l).join(', '), l.attention, l.email, l.storage.length, l.createdBy, fmtDate(l.createdOn), l.updatedBy, fmtDate(l.updatedOn)])]); toast('Exported stock-locations.csv'); }
        else toast('Schedule report is not part of this prototype');
      });
      setTimeout(() => document.addEventListener('click', function off(ev) { if (!m.contains(ev.target)) { m.remove(); document.removeEventListener('click', off); } }), 0);
    });

    // Success alert after Create / Save (Clarity Alert · Standard · Positive, closable — Figma 308:10115)
    const flashRaw = sessionStorage.getItem('vmi.locFlash');
    if (flashRaw) {
      sessionStorage.removeItem('vmi.locFlash');
      let f; try { f = JSON.parse(flashRaw); } catch { f = null; }
      if (f) {
        const n = `${f.storage} storage location${f.storage === 1 ? '' : 's'}`;
        document.querySelector('.csp-card').insertAdjacentHTML('beforebegin', `
          <div class="cui-alert is-positive" role="status" id="loc-success">
            <span class="cui-alert-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16 9.6"/></svg></span>
            <div class="cui-alert-body"><p class="cui-alert-title">Stock location ${f.kind === 'updated' ? 'updated' : 'created'}</p>
              <p class="cui-alert-desc">${esc(f.name)} was ${f.kind === 'updated' ? 'updated' : 'added'} for ${esc(f.customer)} with ${n}.</p></div>
            <button type="button" class="cui-alert-close" aria-label="Dismiss">×</button>
          </div>`);
        document.querySelector('#loc-success .cui-alert-close').addEventListener('click', e => e.currentTarget.closest('.cui-alert').remove());
      }
    }
    render();
  </script>
</body>
</html>
