<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stock Locations · Coupa Supplier Portal · Vendor Managed Inventory prototype</title>
  <link rel="stylesheet" href="css/clarity-tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="csp-page">
  <main class="csp-main">
    <div class="cust csp-legacy">
      <label for="customer">Select Customer</label>
      <select id="customer">
        <option>Buyer Demo Company</option>
        <option>Coupa Demo Co</option>
      </select>
    </div>

    <h1>Stock Locations</h1>

    <section class="csp-card" aria-label="Stock Locations">
      <div class="views-row">
        <button class="views-btn" data-stub>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
          Views
        </button>
        <span class="current">All</span>
      </div>
      <div class="toolbar">
        <label class="tb-search csp-legacy">
          <input id="search" placeholder="Search" aria-label="Search stock locations">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>
        </label>
      </div>
      <div class="table-scroll" tabindex="0" aria-label="Stock locations table">
        <table class="items csp-legacy">
          <thead><tr>
            <th>Stock Location</th><th>Warehouse</th><th>Aisle</th><th>Bin</th><th>Level</th>
            <th class="num">Items Stored</th><th>Last Cycle Count Date</th><th>Last Updated</th><th>Active</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/supplier-data.js"></script>
  <script>
    renderCspHeader({ primary: 'Stock Levels', tab: 'Stock Locations' });

    // One row per stock location, derived from the same balances as Stock Balances.
    // A location's link opens Stock Balances filtered to it.
    let customer = 'Buyer Demo Company', q = '';
    function locations() {
      const byLoc = new Map();
      for (const i of itemsFor(customer)) {
        const l = byLoc.get(i.location) || { code: i.location, warehouse: i.warehouse, aisle: i.aisle, bin: i.bin, level: i.level, items: [], counted: '', updated: '' };
        l.items.push(i.num);
        if (i.counted > l.counted) l.counted = i.counted;
        if (i.updatedOn > l.updated) l.updated = i.updatedOn;
        byLoc.set(i.location, l);
      }
      return [...byLoc.values()].sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
    }
    function render() {
      const s = q.toLowerCase();
      const rows = locations().filter(l => !s || [l.code, l.warehouse, ...l.items].some(v => v.toLowerCase().includes(s)));
      document.getElementById('rows').innerHTML = rows.length ? rows.map(l => `<tr>
          <td><a href="supplier-stock-location.html?q=${encodeURIComponent(l.code)}" title="View stock balances in ${esc(l.code)}">${esc(l.code)}</a></td>
          <td>${esc(l.warehouse)}</td><td>${esc(l.aisle)}</td><td>${esc(l.bin)}</td><td>${esc(l.level)}</td>
          <td class="num" title="${esc(l.items.join(', '))}">${l.items.length}</td>
          <td>${fmtDate(l.counted)}</td><td>${fmtDateTime(l.updated)}</td><td>Yes</td>
        </tr>`).join('')
        : '<tr class="empty"><td colspan="9">No results found</td></tr>';
    }
    document.getElementById('search').addEventListener('input', e => { q = e.target.value.trim(); render(); });
    document.getElementById('customer').addEventListener('change', e => { customer = e.target.value; render(); });
    render();
  </script>
</body>
</html>
