<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create Stock Location · Coupa Supplier Portal · Vendor Managed Inventory prototype</title>
  <link rel="stylesheet" href="css/clarity-tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="csp-page">
  <main class="csp-main">
    <h1 id="title">Create Stock Location</h1>

    <!-- Figma "Create Stock Location" (207:19585) — Clarity 2 form -->
    <form id="loc" class="c2form" novalidate>
      <section class="c2card">
        <h2>General</h2>
        <div class="c2grid">
          <label class="c2f"><span>Supplier Location Name <em>*</em></span><input name="name" maxlength="80" placeholder="e.g. Laughlin Nevada"></label>
          <label class="c2f"><span>Supplier Stock Management Type <em>*</em></span>
            <select name="mgmt"><option value="OWN">OWN</option><option value="SCON">SCON</option></select>
            <small>OWN: supplier-owned stock. SCON: subcontracting stock received from the buyer for assembly; its consumption is tracked for this stock location.</small></label>
          <label class="c2f"><span>Supplier Location Description</span><textarea name="description" rows="3" placeholder="Describe this stock location"></textarea></label>
          <fieldset class="c2f radios"><legend>Active <em>*</em></legend>
            <label><input type="radio" name="active" value="yes" checked> Yes</label>
            <label><input type="radio" name="active" value="no"> No</label></fieldset>
        </div>
      </section>

      <section class="c2card">
        <h2>Address</h2>
        <div class="c2grid">
          <label class="c2f"><span>Address Line 1 <em>*</em></span><input name="line1" placeholder="Street address or P.O. box"></label>
          <label class="c2f"><span>Address Line 2</span><input name="line2" placeholder="Unit, building or floor"></label>
          <label class="c2f"><span>City</span><input name="city" placeholder="City"></label>
          <label class="c2f"><span>Town</span><input name="town" placeholder="Town"></label>
          <label class="c2f"><span>State</span><select name="state"><option value="">Select state</option></select></label>
          <label class="c2f"><span>Subdivision ISO Code</span><input name="iso" placeholder="e.g. US-NV"></label>
          <label class="c2f"><span>Postal Code</span><input name="zip" placeholder="e.g. 89029"></label>
        </div>
      </section>

      <section class="c2card">
        <h2>Attention</h2>
        <p class="c2sub">Responsible vendor contact for this stock location.</p>
        <div class="c2grid">
          <label class="c2f"><span>Attention</span><input name="attention" placeholder="Vendor contact name"></label>
          <label class="c2f"><span>Attention Email</span><input name="email" type="email" placeholder="name@company.com"><small>Used for email notifications about this stock location.</small></label>
        </div>
      </section>

      <section class="c2card">
        <h2>Storage Locations</h2>
        <p class="c2sub">At least one storage location is required. Add a row for each aisle / bin / location in this stock location.</p>
        <table class="c2table">
          <thead><tr><th>Aisle</th><th>Bin</th><th>Location</th><th class="c">Active</th><th class="c">Actions</th></tr></thead>
          <tbody id="storage"></tbody>
        </table>
        <button type="button" class="btn-outline-sm" id="add-row">+ Add storage location</button>
      </section>

      <div class="c2actions">
        <a href="supplier-stock-locations.html" class="btn-text-sm" id="cancel">Cancel</a>
        <button type="submit" class="btn-primary-sm" id="submit">Create</button>
      </div>
    </form>
  </main>

  <script src="js/app.js"></script>
  <script src="js/supplier-data.js"></script>
  <script>
    renderCspHeader({ primary: 'Stock Levels', tab: 'Stock Locations' });
    const params = new URLSearchParams(location.search);
    const customer = STOCK_LOCATIONS[params.get('customer')] ? params.get('customer') : 'Buyer Demo Company';
    const editing = params.get('edit') ? stockLocationsFor(customer).find(l => l.code === params.get('edit')) : null;
    const form = document.getElementById('loc'), body = document.getElementById('storage');
    const STATES = { AZ: 'Arizona', CA: 'California', NV: 'Nevada', UT: 'Utah' };
    form.state.insertAdjacentHTML('beforeend', Object.entries(STATES).map(([k, v]) => `<option value="${k}">${v}</option>`).join(''));
    form.state.addEventListener('change', () => { if (form.state.value && !form.iso.value) form.iso.value = `US-${form.state.value}`; });

    const TRASH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>';
    const row = (s = { aisle: '', bin: '', level: '', active: true }) => body.insertAdjacentHTML('beforeend', `<tr>
        <td><input data-f="aisle" value="${esc(s.aisle)}" aria-label="Aisle"></td><td><input data-f="bin" value="${esc(s.bin)}" aria-label="Bin"></td>
        <td><input data-f="level" value="${esc(s.level)}" aria-label="Location"></td>
        <td class="c"><input type="checkbox" data-f="active" ${s.active ? 'checked' : ''} aria-label="Active"></td>
        <td class="c"><button type="button" class="row-act" data-del aria-label="Remove storage location">${TRASH}</button></td></tr>`);

    if (editing) {
      document.title = document.title.replace('Create', 'Edit');
      document.getElementById('title').textContent = `Edit Stock Location — ${editing.name}`;
      document.getElementById('submit').textContent = 'Save';
      for (const k of ['name', 'mgmt', 'description', 'line1', 'line2', 'city', 'town', 'state', 'iso', 'zip', 'attention', 'email']) if (form[k]) form[k].value = editing[k] || '';
      form.active.value = editing.active ? 'yes' : 'no';
      editing.storage.forEach(row);
    } else row();

    document.getElementById('add-row').addEventListener('click', () => { row(); body.lastElementChild.querySelector('input').focus(); });
    body.addEventListener('click', e => {
      if (!e.target.closest('[data-del]')) return;
      if (body.children.length === 1) return toast('At least one storage location is required');
      e.target.closest('tr').remove();
    });

    form.addEventListener('submit', e => {
      e.preventDefault();
      form.querySelectorAll('.field-error').forEach(el => el.classList.remove('field-error'));
      const v = Object.fromEntries(new FormData(form));
      const storage = [...body.querySelectorAll('tr')].map(tr => ({
        aisle: tr.querySelector('[data-f=aisle]').value.trim(), bin: tr.querySelector('[data-f=bin]').value.trim(),
        level: tr.querySelector('[data-f=level]').value.trim(), active: tr.querySelector('[data-f=active]').checked })).filter(s => s.aisle || s.bin || s.level);
      const name = v.name.trim();
      const dup = name && stockLocationsFor(customer).some(l => l.code !== editing?.code && l.name.toLowerCase() === name.toLowerCase());
      const bad = [];
      if (!name || dup) bad.push(form.name);
      if (!v.line1.trim()) bad.push(form.line1);
      if (!storage.length) bad.push(body.querySelector('input'));
      if (bad.length) {
        bad.forEach(el => el.classList.add('field-error')); bad[0].focus();
        return toast(dup ? 'A stock location with this name already exists for this customer.' : !storage.length && bad.length === 1 ? 'At least one storage location is required.' : 'Fill in the required fields (*).');
      }
      const d = new Date(), today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const fields = { name, mgmt: v.mgmt, description: v.description.trim(), active: v.active === 'yes', line1: v.line1.trim(), line2: v.line2.trim(), city: v.city.trim(), town: v.town.trim(),
        state: v.state, iso: v.iso.trim(), zip: v.zip.trim(), country: 'United States', attention: v.attention.trim(), email: v.email.trim(), storage, updatedBy: CURRENT_USER, updatedOn: today };
      if (editing) {
        const all = JSON.parse(localStorage.getItem(EDIT_LOC_KEY) || '{}');
        (all[customer] = all[customer] || {})[editing.code] = fields;
        localStorage.setItem(EDIT_LOC_KEY, JSON.stringify(all));
        sessionStorage.setItem('vmi.locFlash', `Stock location ${name} updated`);
      } else {
        const all = JSON.parse(localStorage.getItem(NEW_LOC_KEY) || '{}');
        const code = name.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() + Date.now().toString().slice(-3);
        (all[customer] = all[customer] || []).push({ code, type: 'Warehouse', createdBy: CURRENT_USER, createdOn: today, ...fields });
        localStorage.setItem(NEW_LOC_KEY, JSON.stringify(all));
        sessionStorage.setItem('vmi.locFlash', `Stock location ${name} created for ${customer}`);
      }
      location.href = `supplier-stock-locations.html?customer=${encodeURIComponent(customer)}`;
    });
  </script>
</body>
</html>
